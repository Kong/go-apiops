openapi: 3.0.0
info:
  title: Parameter Composition API
servers:
  - url: https://api.example.com
paths:
  /items/{id}:
    parameters:
      - name: filter
        in: query
        schema:
          allOf:
            - $ref: '#/components/schemas/BaseFilter'
            - type: object
              properties:
                active:
                  type: boolean
    get:
      operationId: get-item
      summary: Get an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sort
          in: query
          schema:
            oneOf:
              - type: string
              - type: number
components:
  schemas:
    BaseFilter:
      type: object
      properties:
        name:
          type: string
      required:
        - name
